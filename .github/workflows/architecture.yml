name: Architecture

"on":
  push:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flint-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-check:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            npm ci --no-audit --no-fund
          else
            echo "No npm lockfile found; using npm install for this architecture run." >&2
            npm install --no-audit --no-fund
          fi

      # The current phase-2 checker performs static Rust source analysis and does not
      # invoke cargo. Add Rust setup here if the CI phase advances to phase 4+.
      - name: Check architecture checker tests
        shell: bash
        run: node --test scripts/test-architecture-checker.mjs

      - name: Check architecture boundaries
        shell: bash
        run: node scripts/check-architecture.mjs --phase 2
