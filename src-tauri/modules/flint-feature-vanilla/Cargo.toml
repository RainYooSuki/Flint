[package]
name = "flint-feature-vanilla"
version.workspace = true
description = "Vanilla Minecraft Java, version, and installation feature for Flint"
authors = ["Flint Contributors"]
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
flint-core = { path = "../../crates/flint-core" }
flint-feature-api = { path = "../../crates/flint-feature-api" }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "=1.11.1"
reqwest = { version = "=0.12.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha1 = "=0.10.6"