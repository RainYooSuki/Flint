[package]
name = "flint-feature-accounts"
version.workspace = true
description = "Microsoft and offline account feature for Flint"
authors = ["Flint Contributors"]
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
flint-core = { path = "../../crates/flint-core" }
flint-feature-api = { path = "../../crates/flint-feature-api" }
flint-feature-settings = { path = "../flint-feature-settings" }
reqwest = { version = "=0.12.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"