[package]
name = "flint-feature-settings"
version.workspace = true
description = "Settings feature implementation for Flint"
authors = ["Flint Contributors"]
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
flint-core = { path = "../../crates/flint-core" }
flint-feature-api = { path = "../../crates/flint-feature-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"