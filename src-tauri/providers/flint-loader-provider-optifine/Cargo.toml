[package]
name = "flint-loader-provider-optifine"
version.workspace = true
description = "OptiFine LoaderProvider implementation for Flint"
authors = ["Flint Contributors"]
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
flint-core = { path = "../../crates/flint-core" }
flint-provider-api = { path = "../../crates/flint-provider-api" }
regex = "=1.11.1"

[dev-dependencies]
flint-provider-api = { path = "../../crates/flint-provider-api", features = ["test-ports"] }
