[package]
name = "flint"
version = "2026.10.1-d1cce64"
description = "Flint - a cross-platform Minecraft launcher"
authors = ["Flint Contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "flint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
resolver = "2"
members = [".", "crates/flint-core", "crates/flint-feature-api", "crates/flint-provider-api", "modules/flint-feature-accounts", "modules/flint-feature-launch", "modules/flint-feature-vanilla", "modules/flint-feature-settings", "modules/flint-feature-saves", "providers/flint-mod-provider-curseforge", "providers/flint-mod-provider-modrinth", "providers/flint-loader-provider-fabric", "providers/flint-loader-provider-quilt", "providers/flint-loader-provider-forge", "providers/flint-loader-provider-neoforge", "providers/flint-loader-provider-liteloader", "providers/flint-loader-provider-optifine"]

[workspace.package]
version = "2026.10.1-d1cce64"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
reqwest = { version = "=0.12.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
zip = { version = "=2.2.2", default-features = false, features = ["deflate"] }
sha1 = "=0.10.6"
regex = "=1.11.1"
md5 = "=0.7.0"
flate2 = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt"] }
flint-core = { path = "crates/flint-core" }
flint-feature-api = { path = "crates/flint-feature-api" }
flint-feature-accounts = { path = "modules/flint-feature-accounts" }
flint-feature-launch = { path = "modules/flint-feature-launch" }
flint-feature-vanilla = { path = "modules/flint-feature-vanilla" }
flint-feature-saves = { path = "modules/flint-feature-saves" }
flint-feature-settings = { path = "modules/flint-feature-settings" }
flint-provider-api = { path = "crates/flint-provider-api" }
flint-mod-provider-curseforge = { path = "providers/flint-mod-provider-curseforge" }
flint-mod-provider-modrinth = { path = "providers/flint-mod-provider-modrinth" }
flint-loader-provider-fabric = { path = "providers/flint-loader-provider-fabric" }
flint-loader-provider-quilt = { path = "providers/flint-loader-provider-quilt" }
flint-loader-provider-forge = { path = "providers/flint-loader-provider-forge" }
flint-loader-provider-neoforge = { path = "providers/flint-loader-provider-neoforge" }
flint-loader-provider-liteloader = { path = "providers/flint-loader-provider-liteloader" }
flint-loader-provider-optifine = { path = "providers/flint-loader-provider-optifine" }
