[package]
name = "flint-core"
version.workspace = true
description = "Shared policy, typed ports, and contract primitives for Flint"
authors = ["Flint Contributors"]
edition = "2021"
rust-version = "1.90"

[dependencies]
dirs = "5"
reqwest = { version = "=0.12.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
regex = "=1.11.1"
serde_json = "1"
sha1 = "=0.10.6"
