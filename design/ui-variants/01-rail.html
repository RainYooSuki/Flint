<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>A · 图标栏 — Flint</title>
<style>
  :root {
    --bg: #0b1014;
    --chrome: #12181d;
    --rail: #161c21;
    --panel: #10171c;
    --panel-soft: #131c22;
    --line: #29363f;
    --line-soft: #1e2a31;
    --text: #dde7ec;
    --soft: #9aabb4;
    --dim: #64747d;
    --accent: #58c6d2;
    --accent-ink: #071114;
    --accent-fill: #17373d;
    --accent-line: #397982;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070b0e; }
  body {
    display: grid;
    place-items: center;
    color: var(--text);
    font-family: "Microsoft YaHei UI", "Segoe UI", "Noto Sans SC", system-ui, sans-serif;
    font-size: 12px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  button { color: inherit; cursor: pointer; }
  h1, h2, p, dl, dt, dd { margin: 0; }
  svg { display: block; }
  .icon { width: 16px; height: 16px; flex: 0 0 auto; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .frame {
    width: 900px;
    height: 550px;
    display: grid;
    grid-template-rows: 32px minmax(0, 1fr);
    overflow: hidden;
    border: 1px solid #2c3941;
    background: var(--bg);
  }
  .titlebar {
    display: flex;
    min-width: 0;
    align-items: center;
    border-bottom: 1px solid var(--line);
    background: var(--chrome);
    user-select: none;
  }
  .brand { display: flex; height: 100%; min-width: 0; align-items: center; gap: 8px; padding: 0 10px; }
  .brand-mark {
    display: grid;
    width: 18px;
    height: 18px;
    place-items: center;
    border: 1px solid var(--accent-line);
    border-radius: 2px;
    color: var(--accent);
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 10px;
    font-weight: 700;
  }
  .brand-name { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  .variant-label {
    margin-left: 2px;
    padding-left: 9px;
    border-left: 1px solid var(--line);
    color: var(--dim);
    font-size: 9px;
    letter-spacing: .04em;
  }
  .title-context {
    min-width: 0;
    margin-left: auto;
    padding: 0 12px;
    overflow: hidden;
    color: var(--dim);
    font-size: 10px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .window-controls { display: flex; height: 100%; margin-left: 0; }
  .window-button {
    display: grid;
    width: 38px;
    height: 100%;
    padding: 0;
    place-items: center;
    border: 0;
    border-left: 1px solid var(--line-soft);
    background: transparent;
    color: var(--soft);
  }
  .window-button:hover { background: #202a30; color: #fff; }
  .window-button.close:hover { background: #743636; }
  .window-button .icon { width: 13px; height: 13px; }
  .app-body { display: grid; grid-template-columns: 66px minmax(0, 1fr); min-height: 0; overflow: hidden; }
  .rail {
    display: flex;
    min-height: 0;
    flex-direction: column;
    gap: 4px;
    padding: 7px 5px;
    border-right: 1px solid var(--line);
    background: var(--rail);
  }
  .rail-item {
    display: flex;
    min-height: 53px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 2px;
    background: transparent;
    color: var(--dim);
    font-size: 9px;
  }
  .rail-item:hover { background: #1d272d; color: var(--text); }
  .rail-item.active { border-color: var(--accent-line); background: var(--accent-fill); color: var(--accent); }
  .rail-item .icon { width: 17px; height: 17px; }
  .rail-spacer { flex: 1; min-height: 4px; }
  .rail-account {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 9px 0 2px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 9px;
  }
  .avatar {
    display: grid;
    width: 25px;
    height: 25px;
    place-items: center;
    border: 1px solid #36535b;
    border-radius: 2px;
    background: #17282c;
    color: #b8e7ec;
    font-size: 10px;
    font-weight: 600;
  }
  .workspace {
    display: grid;
    min-width: 0;
    min-height: 0;
    grid-template-rows: 43px minmax(0, 1fr) 27px;
    overflow: hidden;
    background: var(--bg);
  }
  .workspace-head {
    display: flex;
    min-width: 0;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    background: #0f161b;
  }
  .workspace-title { display: flex; min-width: 0; align-items: baseline; gap: 9px; }
  .workspace-title h1 { font-size: 15px; font-weight: 600; }
  .workspace-title span { color: var(--dim); font-size: 10px; }
  .status-inline { display: flex; align-items: center; gap: 6px; color: var(--soft); font-size: 10px; white-space: nowrap; }
  .dot { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--accent); }
  .launch-grid {
    display: grid;
    min-width: 0;
    min-height: 0;
    grid-template-columns: minmax(0, 1fr) 246px;
    gap: 10px;
    padding: 13px 14px;
    overflow: hidden;
  }
  .instance-pane {
    display: grid;
    min-width: 0;
    min-height: 0;
    grid-template-rows: 57px minmax(0, 1fr) 45px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: var(--panel);
  }
  .pane-head {
    display: flex;
    min-width: 0;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 13px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--panel-soft);
  }
  .version-copy { min-width: 0; }
  .version-copy .label { display: block; margin-bottom: 1px; color: var(--dim); font-size: 9px; }
  .version-line { display: flex; min-width: 0; align-items: baseline; gap: 8px; }
  .version-line strong { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .version-line span { overflow: hidden; color: var(--soft); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
  .client-state { display: flex; flex: 0 0 auto; align-items: center; gap: 5px; color: #8fc8a8; font-size: 9px; }
  .client-state .dot { background: #73be91; }
  .fact-list { display: flex; min-height: 0; flex-direction: column; justify-content: center; }
  .fact-list > div {
    display: grid;
    min-height: 42px;
    grid-template-columns: 104px minmax(0, 1fr);
    align-items: center;
    gap: 10px;
    padding: 0 13px;
    border-bottom: 1px solid var(--line-soft);
  }
  .fact-list > div:last-child { border-bottom: 0; }
  .fact-list dt { color: var(--dim); font-size: 10px; }
  .fact-list dd { min-width: 0; overflow: hidden; color: #c8d6dd; font-size: 11px; font-variant-numeric: tabular-nums; text-overflow: ellipsis; white-space: nowrap; }
  .fact-list dd.path { font-family: "Cascadia Mono", Consolas, monospace; font-size: 10px; }
  .launch-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: #0e1519;
  }
  .button {
    display: inline-flex;
    height: 30px;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0 11px;
    border: 1px solid #38474f;
    border-radius: 2px;
    background: #172027;
    color: #cbd8de;
    font-size: 11px;
    white-space: nowrap;
  }
  .button:hover { border-color: #50636d; background: #1d2930; color: #fff; }
  .button.primary { border-color: var(--accent-line); background: #17363b; color: #dffbfe; }
  .button.primary:hover { border-color: var(--accent); background: #1d4b51; }
  .button .icon { width: 13px; height: 13px; }
  .side-stack { display: flex; min-width: 0; min-height: 0; flex-direction: column; gap: 10px; }
  .side-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 2px; background: var(--panel); }
  .side-head {
    display: flex;
    min-height: 32px;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 10px;
    border-bottom: 1px solid var(--line-soft);
    background: var(--panel-soft);
    color: var(--soft);
    font-size: 10px;
  }
  .side-head span:last-child { color: var(--dim); font-size: 9px; }
  .account-row { display: flex; min-width: 0; align-items: center; gap: 8px; padding: 9px 10px; }
  .account-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; }
  .account-copy strong { overflow: hidden; font-size: 11px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
  .account-copy small { color: var(--dim); font-size: 9px; }
  .account-row .button { height: 25px; padding: 0 7px; font-size: 9px; }
  .quick-panel { display: flex; flex: 1; min-height: 0; flex-direction: column; }
  .quick-row {
    display: flex;
    min-height: 34px;
    flex: 1;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 0 10px;
    border: 0;
    border-bottom: 1px solid var(--line-soft);
    background: transparent;
    color: var(--soft);
    font-size: 10px;
    text-align: left;
  }
  .quick-row:last-child { border-bottom: 0; }
  .quick-row:hover { background: #172127; color: var(--text); }
  .quick-row .arrow { color: var(--dim); }
  .workspace-foot {
    display: flex;
    min-width: 0;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 12px;
    border-top: 1px solid var(--line);
    background: #0a1014;
    color: var(--dim);
    font-size: 9px;
  }
  .workspace-foot .path { overflow: hidden; font-family: "Cascadia Mono", Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
  .workspace-foot .right { display: flex; flex: 0 0 auto; gap: 10px; }
</style>
</head>
<body>
<div class="frame">
  <header class="titlebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span class="brand-name">Flint</span>
      <span class="variant-label">A · 图标栏</span>
    </div>
    <div class="title-context">启动工作区</div>
    <div class="window-controls" role="group" aria-label="窗口控制">
      <button class="window-button" type="button" aria-label="最小化" title="最小化">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button class="window-button" type="button" aria-label="最大化或还原" title="最大化或还原">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
      </button>
      <button class="window-button close" type="button" aria-label="关闭" title="关闭">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </header>

  <div class="app-body">
    <nav class="rail" aria-label="主导航">
      <button class="rail-item active" type="button" aria-current="page">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span>启动</span>
      </button>
      <button class="rail-item" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
        <span>下载</span>
      </button>
      <button class="rail-item" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg>
        <span>设置</span>
      </button>
      <button class="rail-item" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 6h5v5M19 6l-6 6M4 18l5-5"/></svg>
        <span>工具</span>
      </button>
      <div class="rail-spacer"></div>
      <div class="rail-account" title="离线账户 Player">
        <span class="avatar" aria-hidden="true">P</span>
        <span>Player</span>
      </div>
    </nav>

    <main class="workspace">
      <header class="workspace-head">
        <div class="workspace-title">
          <h1>启动</h1>
          <span>离线模式</span>
        </div>
        <div class="status-inline"><span class="dot"></span>环境就绪</div>
      </header>

      <div class="launch-grid">
        <section class="instance-pane" aria-labelledby="rail-instance-title">
          <div class="pane-head">
            <div class="version-copy">
              <span class="label">当前实例</span>
              <div class="version-line">
                <strong id="rail-instance-title">1.21.4</strong>
                <span>Fabric 0.16.10</span>
              </div>
            </div>
            <span class="client-state"><span class="dot"></span>客户端完整</span>
          </div>

          <dl class="fact-list">
            <div><dt>版本类型</dt><dd>正式版</dd></div>
            <div><dt>游戏目录</dt><dd class="path" title="C:\Users\Player\.minecraft">C:\Users\Player\.minecraft</dd></div>
            <div><dt>Java</dt><dd>Java 21 · Microsoft OpenJDK</dd></div>
            <div><dt>内存与窗口</dt><dd>4096 MB · 854 × 480</dd></div>
            <div><dt>上次启动</dt><dd>今天 20:14</dd></div>
          </dl>

          <div class="launch-actions">
            <button class="button" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 2h10v9H3z"/></svg>
              打开目录
            </button>
            <button class="button primary" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              启动游戏
            </button>
          </div>
        </section>

        <aside class="side-stack" aria-label="账户与快捷操作">
          <section class="side-panel" aria-labelledby="rail-account-title">
            <div class="side-head"><span id="rail-account-title">离线账户</span><span>本地</span></div>
            <div class="account-row">
              <span class="avatar" aria-hidden="true">P</span>
              <span class="account-copy"><strong>Player</strong><small>离线身份</small></span>
              <button class="button" type="button">切换</button>
            </div>
          </section>

          <section class="side-panel quick-panel" aria-labelledby="rail-quick-title">
            <div class="side-head"><span id="rail-quick-title">快捷操作</span><span>4 项</span></div>
            <button class="quick-row" type="button"><span>选择本地版本</span><span class="arrow">›</span></button>
            <button class="quick-row" type="button"><span>下载原版版本</span><span class="arrow">›</span></button>
            <button class="quick-row" type="button"><span>编辑启动设置</span><span class="arrow">›</span></button>
            <button class="quick-row" type="button"><span>查看运行信息</span><span class="arrow">›</span></button>
          </section>
        </aside>
      </div>

      <footer class="workspace-foot">
        <span class="path" title="C:\Users\Player\.minecraft">C:\Users\Player\.minecraft</span>
        <span class="right"><span>Java 21</span><span>4096 MB</span><span>离线模式</span></span>
      </footer>
    </main>
  </div>
</div>
</body>
</html>
